# Rebuilds library.json after an item is added, changed or removed by hand.
name: Rebuild index

on:
  push:
    branches: [main]
    paths: ['items/**', 'scripts/**', 'worker/**', 'tests/**']
  pull_request:
    paths: ['items/**', 'scripts/**', 'worker/**', 'tests/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node scripts/build-index.mjs
      - name: Commit the index if it changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet library.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.json
          git commit -m "Rebuild library index"
          git push
